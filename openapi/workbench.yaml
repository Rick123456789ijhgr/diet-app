openapi: 3.1.0
info:
  title: 開發工作台 API
  version: 0.1.0
  description: |
    工作台 React 前端 ↔ Go 的 REST API 規格（ADR 0003）。先改本檔，再以 make gen 產生程式碼。

    - `/workbench/v1/dev/*`：開發工具，只在 `WORKBENCH_DEV_TOOLS=1` 時存在，未開啟時一律 404；Go 以 gRPC 轉給 Python。
    - `/workbench/v1/auth/*`：登入。
    - `/workbench/v1/coldstart/*`：冷啟動上傳（任務書 2.6 節），須登入；不受開發模式影響。
      Go 未設定資料庫（DATABASE_URL）時回 503 DB_UNAVAILABLE。

    設定參數（`config`、`ladder` 等）只帶與預設值不同的欄位，結構見 `GET /dev/config-schemas`。
    錯誤一律回傳 `Error`，`code` 為英文代碼，由前端對應中文。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: auth
    description: 登入與工作階段
  - name: dev
    description: 開發工具（只在本機開發模式啟用）
  - name: coldstart
    description: 冷啟動上傳：包裝照片 → 前處理 → 人工確認 → 寫入產品資料庫
paths:
  /workbench/v1/auth/login:
    post:
      operationId: login
      summary: 帳號密碼登入，成功時設定 HttpOnly Cookie
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登入成功
          headers:
            Set-Cookie:
              description: 工作階段 Cookie（HttpOnly、SameSite=Lax；線上部署加 Secure）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DbUnavailable"
  /workbench/v1/auth/logout:
    post:
      operationId: logout
      summary: 登出並刪除工作階段
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: 已登出
        "401":
          $ref: "#/components/responses/Unauthorized"
  /workbench/v1/auth/me:
    get:
      operationId: getMe
      summary: 目前登入者
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 目前登入者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DbUnavailable"

  /workbench/v1/coldstart/submissions:
    get:
      operationId: listSubmissions
      summary: 列出冷啟動上傳（新的在前）
      tags: [coldstart]
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: 只列出此狀態；省略時列出全部
          schema:
            $ref: "#/components/schemas/SubmissionStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 上傳清單
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubmissionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DbUnavailable"
    post:
      operationId: createSubmission
      summary: 建立一筆上傳（草稿）
      tags: [coldstart]
      security:
        - sessionCookie: []
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DbUnavailable"

  /workbench/v1/coldstart/submissions/{submission_id}:
    get:
      operationId: getSubmission
      summary: 取得上傳內容與前處理結果
      tags: [coldstart]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: 上傳內容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DbUnavailable"

  /workbench/v1/coldstart/submissions/{submission_id}/images/{kind}:
    put:
      operationId: uploadSubmissionImage
      summary: 上傳照片（重傳同一種會取代）
      description: |
        Go 把原檔存進 MinIO，再呼叫 Python 前處理：front → 品質檢查；barcode → 品質檢查＋條碼解碼；
        label → 品質檢查＋營養標示前處理。前處理失敗（例如 Python 未啟動）時照片仍會保存，摘要的 error 說明原因。
        條碼照片解出唯一的條碼、且草稿尚未填條碼時，預先填入草稿（仍須人確認）。
      tags: [coldstart]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/ImageKind"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG 或 PNG
      responses:
        "200":
          description: 已保存；回傳更新後的上傳內容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          $ref: "#/components/responses/DbUnavailable"
    get:
      operationId: getSubmissionImage
      summary: 取得上傳的原圖
      tags: [coldstart]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/ImageKind"
      responses:
        "200":
          description: 原圖
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DbUnavailable"

  /workbench/v1/coldstart/submissions/{submission_id}/draft:
    put:
      operationId: saveDraft
      summary: 儲存人工輸入（草稿可缺欄位）
      tags: [coldstart]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Draft"
      responses:
        "200":
          description: 已儲存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "503":
          $ref: "#/components/responses/DbUnavailable"

  /workbench/v1/coldstart/submissions/{submission_id}/confirm:
    post:
      operationId: confirmSubmission
      summary: 確認並寫入產品資料庫
      description: |
        - create：建立新產品與兩種基準的營養標示；同一條碼（GTIN）已存在時回 409 BARCODE_EXISTS（附既有產品）。
        - add_images：照片補到既有產品（product_id），不改營養數值。
        - revise_nutrition：既有產品新增一版營養標示，舊版保留並標記為已取代。
        欄位不完整回 422 DRAFT_INCOMPLETE；數值不一致（每份與每 100 換算不符、飽和＋反式 > 脂肪、糖 > 碳水）
        回 422 NUTRITION_INCONSISTENT，人確認標示確實如此後以 accept_warnings 再送一次即照原樣存入。
      tags: [coldstart]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "200":
          description: 已確認
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: 草稿不完整（DRAFT_INCOMPLETE）或數值不一致（NUTRITION_INCONSISTENT）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmProblem"
        "503":
          $ref: "#/components/responses/DbUnavailable"

  /workbench/v1/coldstart/submissions/{submission_id}/reject:
    post:
      operationId: rejectSubmission
      summary: 退回（不建立產品）
      tags: [coldstart]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: 已退回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "503":
          $ref: "#/components/responses/DbUnavailable"

  /workbench/v1/coldstart/products/{barcode}:
    get:
      operationId: getProduct
      summary: 以條碼查產品（UPC-A 與 EAN-13 視為同一條碼）
      tags: [coldstart]
      security:
        - sessionCookie: []
      parameters:
        - name: barcode
          in: path
          required: true
          description: 8 到 14 位數字
          schema:
            type: string
      responses:
        "200":
          description: 產品、有效的營養標示與照片
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DbUnavailable"

  /workbench/v1/dev/config-schemas:
    get:
      operationId: getConfigSchemas
      summary: 參數表單結構（由 Python 的 param() 宣告產生）
      tags: [dev]
      responses:
        "200":
          description: 各設定類別的欄位資訊
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSchemas"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/images:
    post:
      operationId: putImage
      summary: 上傳並暫存影像
      description: 暫存在 Python 記憶體（約 64 張，最久未用的先移除）；重啟後清空，前端遇到 IMAGE_NOT_FOUND 時重新上傳。
      tags: [dev]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG／PNG 等影像檔
                name:
                  type: string
                  description: 顯示用名稱（例如原檔名）
      responses:
        "201":
          description: 已暫存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/images/synthesize:
    post:
      operationId: synthesizeImage
      summary: 產生合成影像並暫存（附真值）
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynthesizeRequest"
      responses:
        "201":
          description: 已暫存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/images/{image_id}/degrade:
    post:
      operationId: degradeImage
      summary: 套用模擬退化，產生新的暫存影像
      description: 同一張影像以相同參數退化時，Python 直接回傳快取的結果。
      tags: [dev]
      parameters:
        - $ref: "#/components/parameters/ImageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegradeRequest"
      responses:
        "201":
          description: 已暫存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/views:
    post:
      operationId: renderView
      summary: 產生診斷影像或圖表資料
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderViewRequest"
      responses:
        "200":
          description: 影像型檢視填 image，資料型檢視填 data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderViewResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      summary: 取得暫存影像或診斷影像
      tags: [dev]
      parameters:
        - name: artifact_id
          in: path
          required: true
          description: 暫存影像的 image_id 或診斷影像的 ID
          schema:
            type: string
      responses:
        "200":
          description: 影像檔
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/quality:
    post:
      operationId: checkQuality
      summary: 品質檢查（模糊、曝光、解析度）
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRequest"
      responses:
        "200":
          description: 檢查結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/barcode:
    post:
      operationId: decodeBarcode
      summary: 條碼逐步升級
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LadderRequest"
      responses:
        "200":
          description: 解碼結果與各階嘗試
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/invoice-qr:
    post:
      operationId: locateInvoiceQr
      summary: 電子發票雙 QR 定位
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LadderRequest"
      responses:
        "200":
          description: 左右 QR 與各階嘗試
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceQrResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/label:
    post:
      operationId: preprocessLabel
      summary: 營養標示前處理（定位、校正、光斑、對比）
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRequest"
      responses:
        "200":
          description: 校正後影像與表格四角
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/food:
    post:
      operationId: preprocessFood
      summary: 食物照片前處理（VLM 輸入、切菜、盤緣）
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRequest"
      responses:
        "200":
          description: VLM 輸入影像、菜色框與盤緣
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/sweeps:
    post:
      operationId: runSweep
      summary: 參數掃描
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SweepRequest"
      responses:
        "200":
          description: 掃描結果（結構隨研究需求調整，由 Python 定義）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/batches:
    post:
      operationId: runBatch
      summary: 資料夾批次（以 SSE 逐張回報）
      description: 每個事件的 data 為一張影像的結果 JSON；拒絕 test split 下的路徑（SPLIT_LOCKED）。
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: Server-Sent Events 串流
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SplitLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/e1/runs:
    get:
      operationId: listE1Runs
      summary: 列出 E1 執行結果
      tags: [dev]
      parameters:
        - $ref: "#/components/parameters/E1Root"
      responses:
        "200":
          description: 執行清單（結構由 Python 定義）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeJson"
        "403":
          $ref: "#/components/responses/SplitLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: startE1Run
      summary: E1 快速執行（以 SSE 回報進度，最後一個事件為結果）
      tags: [dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartE1RunRequest"
      responses:
        "200":
          description: Server-Sent Events 串流
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SplitLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /workbench/v1/dev/e1/runs/{run_id}:
    get:
      operationId: getE1Run
      summary: 取得一次 E1 執行的結果
      tags: [dev]
      parameters:
        - name: run_id
          in: path
          required: true
          description: 執行資料夾名稱（位於 root 之下）
          schema:
            type: string
        - $ref: "#/components/parameters/E1Root"
      responses:
        "200":
          description: 執行結果（結構由 Python 定義）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeJson"
        "403":
          $ref: "#/components/responses/SplitLocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wb_session
      description: 登入後由 Go 設定的工作階段 Cookie
  parameters:
    SubmissionId:
      name: submission_id
      in: path
      required: true
      description: 上傳的 ID
      schema:
        type: string
    ImageKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ImageKind"
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 上次取得的 updated_at；與目前版本不同時回 412，避免覆蓋別人的修改
      schema:
        type: string
    ImageId:
      name: image_id
      in: path
      required: true
      description: 暫存影像的 ID
      schema:
        type: string
    E1Root:
      name: root
      in: query
      required: false
      description: E1 結果所在資料夾（本機路徑）；省略時使用預設的 runs 資料夾
      schema:
        type: string
  responses:
    Conflict:
      description: 條碼已存在（BARCODE_EXISTS）或上傳已確認／退回（SUBMISSION_CLOSED）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictError"
    PreconditionFailed:
      description: 已被其他人修改（PRECONDITION_FAILED），請重新載入
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DbUnavailable:
      description: 沒有設定資料庫或物件儲存，或無法連線（DB_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: 參數不合法（例如 INVALID_CONFIG，field 為欄位名稱）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未登入或帳號密碼錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 找不到資源（例如 IMAGE_NOT_FOUND）；開發工具未啟用時也回 404
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SplitLocked:
      description: 路徑屬於 test split，已鎖定（SPLIT_LOCKED）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: 上傳檔案超過 32 MB（IMAGE_TOO_LARGE）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Python 服務無法連線（AI_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 英文錯誤代碼，例如 IMAGE_NOT_FOUND、INVALID_CONFIG、SPLIT_LOCKED、AI_UNAVAILABLE
        message:
          type: string
          description: 給開發者看的說明
        field:
          type: string
          description: 出錯的欄位名稱（設定驗證失敗時）

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, username, display_name]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string

    ConfigOverride:
      type: object
      description: '只含與預設值不同的設定欄位，例如 {"blur_min": 150}；省略或空物件表示全部用預設值'
      additionalProperties: true
    FreeJson:
      type: object
      description: 結構由 Python 定義的 JSON 物件（只有工作台會讀）
      additionalProperties: true
    ConfigSchemas:
      type: object
      required: [classes, enums]
      properties:
        classes:
          type: array
          items:
            $ref: "#/components/schemas/ConfigClass"
        enums:
          type: object
          description: 列舉的可用值，例如 Rung、CodeFormat、PreprocessWarning
          additionalProperties:
            type: array
            items:
              type: string
    ConfigClass:
      type: object
      required: [name, doc, fields, defaults]
      properties:
        name:
          type: string
          description: 設定類別名稱，例如 QualityConfig、Degradation
        doc:
          type: string
        fields:
          type: array
          description: 以 param() 宣告、可自動產生表單的欄位（依宣告順序）
          items:
            $ref: "#/components/schemas/ConfigField"
        defaults:
          type: object
          description: 全部欄位的預設值（含未以 param() 宣告的序列欄位，例如 rungs）
          additionalProperties: true
    ConfigField:
      type: object
      required: [name, type, default, label, label_en, help, calibrate, group]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [int, float, bool]
        default:
          oneOf:
            - type: number
              format: double
            - type: boolean
        label:
          type: string
          description: 中文名稱
        label_en:
          type: string
        help:
          type: string
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        step:
          type: number
          format: double
        calibrate:
          type: boolean
          description: true 表示數值待校準
        group:
          type: string
          description: 介面分組代碼，例如 blur、exposure

    ImageRef:
      type: object
      required: [image_id, width, height, description]
      properties:
        image_id:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        description:
          type: string
        truth:
          $ref: "#/components/schemas/FreeJson"
          description: 合成影像的真值（四角、盤緣等）；沒有則省略
    SynthesizeRequest:
      type: object
      required: [scene]
      properties:
        scene:
          type: string
          enum: [label, ean13, invoice, nutrition, food]
        params:
          type: object
          description: '場景參數，例如 {"seed": 0}'
          additionalProperties: true
    DegradeRequest:
      type: object
      required: [degradation]
      properties:
        degradation:
          $ref: "#/components/schemas/ConfigOverride"
    RenderViewRequest:
      type: object
      required: [image_id, view]
      properties:
        image_id:
          type: string
        view:
          type: string
          enum: [laplacian, exposure, histogram, label_edges, glare_mask, food_mask, ladder_variant]
        config:
          $ref: "#/components/schemas/ConfigOverride"
    RenderViewResult:
      type: object
      properties:
        image:
          $ref: "#/components/schemas/ImageRef"
        data:
          $ref: "#/components/schemas/FreeJson"

    ConfigRequest:
      type: object
      required: [image_id]
      properties:
        image_id:
          type: string
        config:
          $ref: "#/components/schemas/ConfigOverride"
    LadderRequest:
      type: object
      required: [image_id]
      properties:
        image_id:
          type: string
        ladder:
          $ref: "#/components/schemas/ConfigOverride"
        zxing:
          $ref: "#/components/schemas/ConfigOverride"
    Step:
      type: object
      required: [name, elapsed_ms, params]
      properties:
        name:
          type: string
        elapsed_ms:
          type: number
          format: double
        params:
          type: object
          additionalProperties: true
    Point:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
    Box:
      type: object
      required: [x, y, w, h]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
    Ellipse:
      type: object
      required: [cx, cy, major, minor, angle]
      properties:
        cx:
          type: number
          format: double
        cy:
          type: number
          format: double
        major:
          type: number
          format: double
        minor:
          type: number
          format: double
        angle:
          type: number
          format: double
    ImageOutput:
      type: object
      required: [artifact_id, width, height]
      properties:
        artifact_id:
          type: string
          description: 以 GET /dev/artifacts/{artifact_id} 取得
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32

    QualityResult:
      type: object
      required:
        - passed
        - blur_score
        - mean_brightness
        - dark_ratio
        - bright_ratio
        - resolution_ok
        - warnings
        - steps
      properties:
        passed:
          type: boolean
        blur_score:
          type: number
          format: double
        mean_brightness:
          type: number
          format: double
        dark_ratio:
          type: number
          format: double
        bright_ratio:
          type: number
          format: double
        resolution_ok:
          type: boolean
        warnings:
          type: array
          description: PreprocessWarning 代碼，例如 TOO_BLURRY
          items:
            type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"

    DecodeHit:
      type: object
      required: [format, text, raw, corners]
      properties:
        format:
          type: string
          description: CodeFormat，例如 EAN13
        text:
          type: string
        raw:
          type: string
          format: byte
          description: 原始位元組（base64）
        corners:
          type: array
          items:
            $ref: "#/components/schemas/Point"
    RungAttempt:
      type: object
      required: [rung, params, elapsed_ms, hits, rejected, skipped]
      properties:
        rung:
          type: string
          description: Rung，例如 deskew
        params:
          type: object
          additionalProperties: true
        elapsed_ms:
          type: number
          format: double
        hits:
          type: array
          items:
            $ref: "#/components/schemas/DecodeHit"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/DecodeHit"
        skipped:
          type: boolean
    BarcodeResult:
      type: object
      required: [success, success_index, hits, attempts, warnings, steps]
      properties:
        success:
          type: boolean
        success_rung:
          type: string
        success_index:
          type: integer
          description: -1 表示失敗
        hits:
          type: array
          items:
            $ref: "#/components/schemas/DecodeHit"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/RungAttempt"
        warnings:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
    InvoiceQrResult:
      type: object
      required: [attempts, warnings, steps]
      properties:
        left:
          $ref: "#/components/schemas/DecodeHit"
        right:
          $ref: "#/components/schemas/DecodeHit"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/RungAttempt"
        warnings:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
    LabelResult:
      type: object
      required: [image, quad, glare_ratio, warnings, steps]
      properties:
        image:
          $ref: "#/components/schemas/ImageOutput"
        quad:
          type: array
          description: 原圖上的表格四角（左上起順時針）；找不到則為空
          items:
            $ref: "#/components/schemas/Point"
        quad_method:
          type: string
          description: contour／hough
        glare_ratio:
          type: number
          format: double
          description: 光斑步驟未啟用時為 -1
        warnings:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
    VlmImage:
      type: object
      required: [image, num_bytes, scale]
      properties:
        image:
          $ref: "#/components/schemas/ImageOutput"
        num_bytes:
          type: integer
          format: int64
        scale:
          type: number
          format: double
    FoodResult:
      type: object
      required:
        - whole
        - dishes_enabled
        - dishes
        - crops
        - plates_enabled
        - plates
        - warnings
        - steps
      properties:
        whole:
          $ref: "#/components/schemas/VlmImage"
        dishes_enabled:
          type: boolean
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/Box"
        crops:
          type: array
          items:
            $ref: "#/components/schemas/VlmImage"
        plates_enabled:
          type: boolean
        plates:
          type: array
          items:
            $ref: "#/components/schemas/Ellipse"
        warnings:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"

    SweepRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          enum: [quality, barcode]
        params:
          type: object
          additionalProperties: true
    BatchRequest:
      type: object
      required: [folder]
      properties:
        folder:
          type: string
          description: 本機資料夾路徑；test split 已鎖定
        recursive:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
        config:
          $ref: "#/components/schemas/ConfigOverride"
    StartE1RunRequest:
      type: object
      required: [arms]
      properties:
        arms:
          type: array
          items:
            type: string
        n_codes:
          type: integer
          minimum: 1
        root:
          type: string

    # ── 冷啟動上傳（任務書 2.6 節） ──
    SubmissionStatus:
      type: string
      enum: [draft, confirmed, rejected]
    ImageKind:
      type: string
      enum: [front, barcode, label]
      description: front＝包裝正面、barcode＝條碼、label＝營養標示
    ContentUnit:
      type: string
      enum: [g, ml]
    Nutrients:
      type: object
      description: 台灣營養標示的八項必要欄位；草稿中都可省略
      properties:
        energy_kcal:
          type: number
          format: double
          minimum: 0
        protein_g:
          type: number
          format: double
          minimum: 0
        fat_g:
          type: number
          format: double
          minimum: 0
        saturated_fat_g:
          type: number
          format: double
          minimum: 0
        trans_fat_g:
          type: number
          format: double
          minimum: 0
        carbohydrate_g:
          type: number
          format: double
          minimum: 0
        sugar_g:
          type: number
          format: double
          minimum: 0
        sodium_mg:
          type: number
          format: double
          minimum: 0
    Draft:
      type: object
      description: 人工輸入中的欄位；草稿可缺欄位，確認時才檢查完整性
      properties:
        barcode:
          type: string
          description: 標示上的條碼數字（8 到 14 位）
        name:
          type: string
        brand:
          type: string
        net_content:
          type: number
          format: double
          exclusiveMinimum: 0
        content_unit:
          $ref: "#/components/schemas/ContentUnit"
        serving_size:
          type: number
          format: double
          exclusiveMinimum: 0
          description: 每份的量（單位同 content_unit）
        servings_per_package:
          type: number
          format: double
          exclusiveMinimum: 0
        nutrition:
          type: object
          properties:
            per_serving:
              $ref: "#/components/schemas/Nutrients"
            per_100:
              $ref: "#/components/schemas/Nutrients"
    BarcodeHit:
      type: object
      required: [format, text]
      properties:
        format:
          type: string
        text:
          type: string
    ImagePreprocess:
      type: object
      description: 前處理摘要，只供參考；數值不寫入產品
      required: [warnings]
      properties:
        quality_passed:
          type: boolean
        warnings:
          type: array
          items:
            type: string
          description: PreprocessWarning 代碼
        barcodes:
          type: array
          items:
            $ref: "#/components/schemas/BarcodeHit"
          description: 條碼照片解出的條碼
        label_quad:
          type: array
          items:
            $ref: "#/components/schemas/Point"
          description: 營養標示照片中表格的四角（原圖座標）
        error:
          type: string
          description: 前處理失敗的原因（照片仍已保存）
    SubmissionImage:
      type: object
      required: [kind, width, height, content_type, uploaded_at, preprocess]
      properties:
        kind:
          $ref: "#/components/schemas/ImageKind"
        width:
          type: integer
        height:
          type: integer
        content_type:
          type: string
        uploaded_at:
          type: string
          format: date-time
        preprocess:
          $ref: "#/components/schemas/ImagePreprocess"
    Submission:
      type: object
      required: [id, status, draft, images, created_by, created_at, updated_at]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        draft:
          $ref: "#/components/schemas/Draft"
        images:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionImage"
        product_id:
          type: string
        reject_reason:
          type: string
        created_by:
          $ref: "#/components/schemas/User"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          description: 樂觀鎖版本；寫入時放在 If-Match 標頭
        confirmed_by:
          $ref: "#/components/schemas/User"
        confirmed_at:
          type: string
          format: date-time
    SubmissionSummary:
      type: object
      required: [id, status, images, created_by, updated_at]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        barcode:
          type: string
        name:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageKind"
          description: 已上傳的照片種類
        created_by:
          $ref: "#/components/schemas/User"
        updated_at:
          type: string
          format: date-time
    NutritionFacts:
      allOf:
        - $ref: "#/components/schemas/Nutrients"
        - type: object
          required: [confirmed_by, confirmed_at]
          properties:
            confirmed_by:
              $ref: "#/components/schemas/User"
            confirmed_at:
              type: string
              format: date-time
    ProductImage:
      type: object
      required: [kind, submission_id, width, height]
      properties:
        kind:
          $ref: "#/components/schemas/ImageKind"
        submission_id:
          type: string
        width:
          type: integer
        height:
          type: integer
    Product:
      type: object
      required: [id, gtin, barcode, name, content_unit, nutrition, images, created_at]
      properties:
        id:
          type: string
        gtin:
          type: string
          description: 補 0 到 14 碼的條碼
        barcode:
          type: string
          description: 標示上的原樣
        name:
          type: string
        brand:
          type: string
        net_content:
          type: number
          format: double
        content_unit:
          $ref: "#/components/schemas/ContentUnit"
        serving_size:
          type: number
          format: double
        servings_per_package:
          type: number
          format: double
        nutrition:
          type: object
          description: 有效（未被取代）的營養標示
          properties:
            per_serving:
              $ref: "#/components/schemas/NutritionFacts"
            per_100:
              $ref: "#/components/schemas/NutritionFacts"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        created_at:
          type: string
          format: date-time
    ConfirmRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [create, add_images, revise_nutrition]
        product_id:
          type: string
          description: add_images、revise_nutrition 時必填
        accept_warnings:
          type: boolean
          default: false
          description: 已確認標示確實如此，數值不一致時仍照原樣存入
    ConfirmResponse:
      type: object
      required: [submission, product]
      properties:
        submission:
          $ref: "#/components/schemas/Submission"
        product:
          $ref: "#/components/schemas/Product"
    NutritionIssue:
      type: object
      required: [code, basis, message]
      properties:
        code:
          type: string
          description: BASIS_MISMATCH（每份與每 100 換算不符）、FAT_PARTS_EXCEED_FAT、SUGAR_EXCEEDS_CARBOHYDRATE
        basis:
          type: string
          enum: [per_serving, per_100, both]
        nutrient:
          type: string
        expected:
          type: number
          format: double
        actual:
          type: number
          format: double
        message:
          type: string
    ConfirmProblem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: DRAFT_INCOMPLETE 或 NUTRITION_INCONSISTENT
        message:
          type: string
        missing:
          type: array
          items:
            type: string
          description: 缺少的欄位（例如 nutrition.per_100.sodium_mg）
        issues:
          type: array
          items:
            $ref: "#/components/schemas/NutritionIssue"
    ConflictError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: BARCODE_EXISTS（附既有產品）、SUBMISSION_CLOSED（已確認或已退回，不能再修改）
        message:
          type: string
        product:
          $ref: "#/components/schemas/Product"
