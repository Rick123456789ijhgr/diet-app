[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dietai"
version = "0.1.0"
description = "飲食紀錄系統 Python 外掛服務：影像前處理、OCR、LLM 校正、資料分析"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# 影像處理；preprocess 的單元測試需要，CI 會安裝。版本鎖定，升級須另開 PR 並重跑 E1。
vision = ["opencv-python-headless==4.12.0.88", "pyzbar==0.1.9", "zxing-cpp==3.1.1"]
# 開發工作台（ai/workbench），只在本機使用；系統執行時不需要
workbench = ["streamlit==1.65.0", "pandas==3.0.6", "altair==6.3.0"]
ocr = ["paddleocr"]
llm = ["litellm"]
analytics = ["pandas>=2.2", "scipy", "pulp"]
# gRPC 服務（dietai.server）；protobuf 版本須與 proto/buf.gen.yaml 的外掛相容
grpc = [
  "grpcio>=1.84",
  "grpcio-health-checking>=1.84",
  "grpcio-status>=1.84",
  "protobuf>=7.36.2",
]
server = ["dietai[grpc]", "psycopg[binary]>=3.1", "pgvector", "minio"]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-grpcio==1.84.0.20260928",
  "types-protobuf==7.35.1.20260906",
  "types-grpcio-status==1.0.0.20260408",
  "types-grpcio-health-checking==1.0.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dietai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["workbench"]
addopts = "-q"
markers = ["slow: 效能基準等較慢的測試（CI 以 -m 'not slow' 略過）"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "workbench"]
# src/dietai/v1 為 buf 產生的 proto 程式碼（見 proto/buf.gen.yaml），不檢查也不格式化
extend-exclude = ["src/dietai/v1"]
# research/ 以 research/ruff.toml 沿用本設定；lint 指令另外傳入 ../research

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# 設定 dataclass 皆為 frozen，可安全作為參數預設值：fn(image, cfg: XxxConfig = XxxConfig())
extend-immutable-calls = [
  "dietai.preprocess.config.QualityConfig",
  "dietai.preprocess.config.ZxingConfig",
  "dietai.preprocess.config.LadderConfig",
  "dietai.preprocess.config.InvoiceQrConfig",
  "dietai.preprocess.config.LabelConfig",
  "dietai.preprocess.config.FoodConfig",
]

[tool.mypy]
python_version = "3.11"
files = [
  "src/dietai/preprocess",
  "src/dietai/synthetic",
  "src/dietai/evaluation",
  "src/dietai/devtools",
  "src/dietai/server",
  "workbench",
  "../research/experiments/e1_barcode",
]
mypy_path = ["src", "workbench"]
explicit_package_bases = true
strict = true
# 呼叫產生的 add_XxxServicer_to_server 等未標註函式
untyped_calls_exclude = ["dietai.v1"]

[[tool.mypy.overrides]]
# buf 產生的 proto 程式碼（*_pb2_grpc.py 沒有型別標註）
module = ["dietai.v1.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# googleapis-common-protos（google.rpc 的錯誤細節）沒有型別資訊；只在 server/rpc.py 使用
module = ["google.rpc", "google.rpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pandas 無內建型別；只在工作台介面使用，不另裝 pandas-stubs
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyzbar 無型別資訊；只在 PyzbarDecoder（實驗對照）使用
module = ["pyzbar", "pyzbar.*"]
ignore_missing_imports = true
