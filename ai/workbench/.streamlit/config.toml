# 工作台只在本機使用：可執行測試指令、讀取本機檔案，因此只綁定 localhost。
[server]
address = "localhost"
port = 8501
# 預設不自動開瀏覽器（測試、CI）；make workbench 與 啟動工作台.bat 會以 --server.headless false 開啟
headless = true
runOnSave = true
# 首次執行不在終端機詢問 email，避免雙擊啟動時卡住
showEmailPrompt = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# ── 主題 ───────────────────────────────────────────────
# 科技簡約風：中性灰底＋白色卡片，靛藍為主色、紫為輔色，不使用綠／橘。
# 共用：字型、圓角、字級。顏色分淺色／深色兩組，右上角開關切換（wb/st_theme.py）。
# 卡片、頂部導覽列等版面外觀見 wb/st_style.py。
# 語意色：成功用青色（greenColor）、警告用黃色（orangeColor）、錯誤用玫瑰紅，避免綠與橘。
[theme]
font = "Inter, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono', Consolas, monospace:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "13px"
headingFontSizes = ["20px", "16px", "14px", "14px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "full"
showWidgetBorder = false
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F8"
textColor = "#0F172A"
borderColor = "#E4E7EE"
linkColor = "#4F46E5"
codeBackgroundColor = "#F3F4F8"
greenColor = "#0891B2"
redColor = "#E11D48"
orangeColor = "#CA8A04"
yellowColor = "#CA8A04"
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#64748B"
dataframeHeaderBackgroundColor = "#F6F7FA"
chartCategoricalColors = ["#4F46E5", "#06B6D4", "#A855F7", "#F43F5E", "#64748B", "#0EA5E9", "#EAB308"]
chartSequentialColors = ["#EEF2FF", "#E0E7FF", "#C7D2FE", "#A5B4FC", "#818CF8", "#6366F1", "#4F46E5", "#4338CA", "#3730A3", "#312E81"]

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F8"
borderColor = "#E4E7EE"

[theme.dark]
