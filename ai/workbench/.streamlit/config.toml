# 工作台只在本機使用：可執行測試指令、讀取本機檔案，因此只綁定 localhost。
[server]
address = "localhost"
port = 8501
# 預設不自動開瀏覽器（測試、CI）；make workbench 與 啟動工作台.bat 會以 --server.headless false 開啟
headless = true
runOnSave = true
# 首次執行不在終端機詢問 email，避免雙擊啟動時卡住
showEmailPrompt = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# ── 主題 ───────────────────────────────────────────────
# 共用：字型、圓角、字級。顏色分淺色／深色兩組，右上角開關切換（wb/st_theme.py）。
[theme]
font = "'Noto Sans TC', 'Microsoft JhengHei', sans-serif:https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
codeFont = "'JetBrains Mono', Consolas, monospace:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
codeFontSize = "13px"
headingFontSizes = ["28px", "21px", "17px", "15px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F7"
textColor = "#1D2733"
borderColor = "#DDE3E9"
linkColor = "#0F766E"
codeBackgroundColor = "#F2F5F7"
greenColor = "#15803D"
redColor = "#C2410C"
orangeColor = "#B45309"
blueColor = "#1D4ED8"
violetColor = "#6D28D9"
dataframeHeaderBackgroundColor = "#EEF2F5"
chartCategoricalColors = ["#0F766E", "#C2410C", "#1D4ED8", "#B45309", "#6D28D9", "#BE185D", "#475569"]
chartSequentialColors = ["#F0FDFA", "#CCFBF1", "#99F6E4", "#5EEAD4", "#2DD4BF", "#14B8A6", "#0D9488", "#0F766E", "#115E59", "#134E4A"]

[theme.light.sidebar]
backgroundColor = "#F7F9FA"
secondaryBackgroundColor = "#ECF0F3"
borderColor = "#DDE3E9"

[theme.dark]
primaryColor = "#14A394"
backgroundColor = "#0E1419"
secondaryBackgroundColor = "#18212A"
textColor = "#E3E9EE"
borderColor = "#2A3540"
linkColor = "#5EEAD4"
codeBackgroundColor = "#141C23"
greenColor = "#4ADE80"
redColor = "#FB923C"
orangeColor = "#FBBF24"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
dataframeHeaderBackgroundColor = "#1B252E"
chartCategoricalColors = ["#2DD4BF", "#FB923C", "#60A5FA", "#FBBF24", "#A78BFA", "#F472B6", "#94A3B8"]
chartSequentialColors = ["#134E4A", "#115E59", "#0F766E", "#0D9488", "#14B8A6", "#2DD4BF", "#5EEAD4", "#99F6E4", "#CCFBF1", "#F0FDFA"]

[theme.dark.sidebar]
backgroundColor = "#11181E"
secondaryBackgroundColor = "#1B252E"
borderColor = "#2A3540"
