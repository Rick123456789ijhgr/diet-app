backgroundColor = "#151922"
secondaryBackgroundColor = "#1E2330"
textColor = "#E6E9F2"
borderColor = "#2A3040"
linkColor = "#A5B4FC"
codeBackgroundColor = "#1A1F2B"
greenColor = "#22D3EE"
redColor = "#FB7185"
orangeColor = "#FACC15"
yellowColor = "#FACC15"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
dataframeHeaderBackgroundColor = "#1A1F2A"
