name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 依變更的資料夾決定要跑哪些 job
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ai: ${{ steps.filter.outputs.ai }}
      app: ${{ steps.filter.outputs.app }}
      proto: ${{ steps.filter.outputs.proto }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'proto/**'
              - 'openapi/**'
              - 'db/**'
            ai:
              - 'ai/**'
              - 'proto/**'
            app:
              - 'app/**'
              - 'openapi/**'
            proto:
              - 'proto/**'
            openapi:
              - 'openapi/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/pyproject.toml
      # preprocess 測試需要 OpenCV（vision），工作台測試需要 Streamlit（workbench）
      - run: pip install -e ".[dev,vision,workbench]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # CI 不呼叫真實 LLM：測試一律使用假實作或快取
      # 效能基準受 runner 負載影響，CI 略過；本機以 make test-ai 執行
      - run: pytest -m "not slow"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true' && hashFiles('app/pubspec.yaml') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # lint、format 檢查；PR 時另外檢查是否破壞相容性
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          push: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto

  openapi:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @redocly/cli@latest lint openapi/openapi.yaml
