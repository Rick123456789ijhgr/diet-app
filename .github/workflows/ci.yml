name: CI

on:
  pull_request:
  push:
    branches: [main]

# 只給需要的最小權限：讀程式碼；dorny/paths-filter 在 pull_request 事件要讀 PR 的變更檔案清單
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 依變更的資料夾決定要跑哪些 job
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ai: ${{ steps.filter.outputs.ai }}
      app: ${{ steps.filter.outputs.app }}
      proto: ${{ steps.filter.outputs.proto }}
      openapi: ${{ steps.filter.outputs.openapi }}
      gen: ${{ steps.filter.outputs.gen }}
      workbench: ${{ steps.filter.outputs.workbench }}
      app_exists: ${{ steps.app.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
      # Flutter 專案建立前（尚無 app/pubspec.yaml）跳過 app job。
      # hashFiles() 不能用在 job 層級的 if，因此在這裡檢查後以 output 傳出。
      - id: app
        run: |
          if [ -f app/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'proto/**'
              - 'openapi/**'
              - 'db/**'
            ai:
              - 'ai/**'
              - 'proto/**'
              - 'research/**'
            app:
              - 'app/**'
              - 'openapi/**'
            proto:
              - 'proto/**'
            openapi:
              - 'openapi/**'
            workbench:
              - 'workbench/**'
              - 'openapi/workbench.yaml'
            # 規格或產生碼有變更時，檢查產生碼與規格一致
            gen:
              - 'proto/**'
              - 'openapi/**'
              - 'api/gen/**'
              - 'ai/src/dietai/v1/**'
              - 'workbench/src/api/gen/**'
              - 'Makefile'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # 資料庫整合測試（internal/pgstore）：每次測試建立暫時的資料庫並套用 db/migrations
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
      TEST_MINIO_ENDPOINT: localhost:9000
      TEST_MINIO_ACCESS_KEY: minio
      TEST_MINIO_SECRET_KEY: minio-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
      # 物件儲存整合測試（internal/platform/objstore）：S3 相容的 RustFS（MinIO 已不提供公開映像）
      - name: 啟動物件儲存（RustFS）
        run: |
          docker run -d -p 9000:9000 -e RUSTFS_ACCESS_KEY=minio -e RUSTFS_SECRET_KEY=minio-secret rustfs/rustfs:1.0.0
          for i in $(seq 1 60); do curl -sf http://localhost:9000/health >/dev/null && exit 0; sleep 1; done
          docker logs "$(docker ps -lq)"; exit 1
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/pyproject.toml
      # pyzbar（條碼解碼對照組）需要系統的 zbar 函式庫；Windows wheel 已內含
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0
      # preprocess 測試需要 OpenCV（vision），gRPC 服務測試需要 grpc
      - run: pip install -e ".[dev,vision,grpc]"
      # research/ 只呼叫 dietai，一併檢查（設定沿用 ai/pyproject.toml，見 research/ruff.toml）
      - run: ruff check . ../research
      - run: ruff format --check . ../research
      - run: mypy
      # CI 不呼叫真實 LLM：測試一律使用假實作或快取
      # 效能基準受 runner 負載影響，CI 略過；本機以 make test-ai 執行
      - run: pytest -m "not slow"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.app_exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # lint、format 檢查；PR 時另外檢查是否破壞相容性
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          push: false
          breaking: ${{ github.event_name == 'pull_request' }}
          # workflow 只有讀取權限；結果看 job 紀錄即可，不在 PR 留言
          pr_comment: false
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto

  openapi:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npx --yes @redocly/cli@latest lint openapi/openapi.yaml openapi/workbench.yaml

  # 工作台前端：lint、型別、單元與元件測試（MSW 假後端）、建置。
  # 接真實 Go 與 Python 的 Playwright 冒煙測試只在本機執行（npm run test:e2e）
  workbench:
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 產生碼提交進 git；重新產生後不得有差異（忘了 make gen 或手改了 gen/ 都會失敗）
  gen:
    needs: changes
    if: needs.changes.outputs.gen == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: make gen
      - name: 檢查產生碼與規格一致
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "產生碼與規格不一致：請在本機執行 make gen 並提交結果"
            exit 1
          fi
