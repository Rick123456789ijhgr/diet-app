syntax = "proto3";

package dietai.v1;

option go_package = "github.com/your-org/diet-app/api/gen/proto/dietai/v1;dietaiv1";

// 開發工作台的輔助服務（Go → Python），只在開發模式（WORKBENCH_DEV_TOOLS=1）註冊。
// 回傳以 JSON 為主：只有工作台會讀，結構隨研究需求調整。
// 讀取本機路徑的 RPC（RunBatch、E1）一律經測試集鎖定，拒絕 splits/test。
service WorkbenchService {
  rpc GetConfigSchemas(GetConfigSchemasRequest) returns (GetConfigSchemasResponse);
  // 上傳並暫存影像；暫存在 Python 記憶體（LRU），重啟即清空
  rpc PutImage(PutImageRequest) returns (PutImageResponse);
  // 合成影像（附真值）
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);
  // 模擬退化，產生新的暫存影像
  rpc Degrade(DegradeRequest) returns (DegradeResponse);
  // 診斷影像或圖表資料
  rpc RenderView(RenderViewRequest) returns (RenderViewResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc Sweep(SweepRequest) returns (SweepResponse);
  // 逐張回傳，前端顯示進度
  rpc RunBatch(RunBatchRequest) returns (stream RunBatchResponse);
  rpc ListE1Runs(ListE1RunsRequest) returns (ListE1RunsResponse);
  rpc GetE1Run(GetE1RunRequest) returns (GetE1RunResponse);
  // 進度＋最後結果
  rpc StartE1Run(StartE1RunRequest) returns (stream StartE1RunResponse);
  // 找最佳流程：內建的處理流程方案（工作台可編輯、另存，修改存在瀏覽器）
  rpc ListBestFlowPresets(ListBestFlowPresetsRequest) returns (ListBestFlowPresetsResponse);
  // 找最佳流程：對資料夾或上傳的圖片執行所選方案的所有方法（進度＋最後結果）
  rpc StartBestFlowRun(StartBestFlowRunRequest) returns (stream StartBestFlowRunResponse);
  // 真值表與結論（推薦流程、單一方法比較）
  rpc GetBestFlowRun(GetBestFlowRunRequest) returns (GetBestFlowRunResponse);
  // 更新人工確認的真值，回傳更新後的真值表與結論
  rpc SetBestFlowTruth(SetBestFlowTruthRequest) returns (SetBestFlowTruthResponse);
  // 圖片批次命名：預覽規則化檔名（不動任何檔案）
  rpc PreviewImageNames(PreviewImageNamesRequest) returns (PreviewImageNamesResponse);
  // 圖片批次命名：依目前的資料夾重新規劃後改名
  rpc ApplyImageNames(ApplyImageNamesRequest) returns (ApplyImageNamesResponse);
  // 圖片批次命名：依 _rename_log.csv 還原全部改名
  rpc UndoImageNames(UndoImageNamesRequest) returns (UndoImageNamesResponse);
  // 資料夾瀏覽：列出子資料夾與影像張數（給工作台的「瀏覽…」彈窗）
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse);
}

// 暫存影像。image_id 與診斷影像的 ID 共用同一個空間，皆可由 GetArtifact 取得
message ImageRef {
  string image_id = 1;
  int32 width = 2;
  int32 height = 3;
  string description = 4;
  string truth_json = 5; // 合成影像的真值（四角、盤緣等）；沒有則為空
}

message GetConfigSchemasRequest {}

message GetConfigSchemasResponse {
  string json = 1; // 各設定類別的 param() 欄位資訊
}

message PutImageRequest {
  bytes encoded = 1;
  string name = 2;
}

message PutImageResponse {
  ImageRef image = 1;
}

message SynthesizeRequest {
  string scene = 1; // label／ean13／invoice／nutrition／food
  string params_json = 2;
}

message SynthesizeResponse {
  ImageRef image = 1;
}

message DegradeRequest {
  string image_id = 1;
  string degradation_json = 2;
}

message DegradeResponse {
  ImageRef image = 1;
}

message RenderViewRequest {
  string image_id = 1;
  // laplacian／exposure／histogram／label_edges／glare_mask／food_mask／ladder_variant
  string view = 2;
  string config_json = 3;
}

message RenderViewResponse {
  ImageRef image = 1; // 影像型檢視（邊緣響應、遮罩等）
  string data_json = 2; // 資料型檢視（例如直方圖），由前端畫圖
}

message GetArtifactRequest {
  string id = 1; // 暫存影像的 image_id 或診斷影像的 ID
}

message GetArtifactResponse {
  bytes encoded = 1;
  string content_type = 2;
}

message SweepRequest {
  string target = 1; // quality／barcode／label
  string params_json = 2;
}

message SweepResponse {
  string json = 1;
}

message RunBatchRequest {
  string folder = 1;
  bool recursive = 2;
  int32 limit = 3;
  string config_json = 4;
}

message RunBatchResponse {
  string json = 1;
}

message ListE1RunsRequest {
  string root = 1;
}

message ListE1RunsResponse {
  string json = 1;
}

message GetE1RunRequest {
  string run_dir = 1;
}

message GetE1RunResponse {
  string json = 1;
}

message StartE1RunRequest {
  repeated string arms = 1;
  int32 n_codes = 2;
  string root = 3;
}

message StartE1RunResponse {
  string json = 1;
}

message ListBestFlowPresetsRequest {}

// json：{"presets": [{"id", "name", "description", "arm": {...}}]}（結構由 Python 定義）
message ListBestFlowPresetsResponse {
  string json = 1;
}

// folder 與 image_ids 擇一；image_ids 為 PutImage 暫存的影像
message StartBestFlowRunRequest {
  string folder = 1;
  repeated string image_ids = 2;
  bool recursive = 3;
  int32 limit = 4; // 0 為預設上限
  string root = 5; // 結果資料夾；空字串為預設
  // 實驗組設定 JSON（同 research/experiments/e1_barcode/configs/*.json 的格式）；
  // 空字串＝c0_all_methods（每個方法都執行，相容舊行為）
  string arm_json = 6;
  string preset_id = 7; // 方案代碼，只寫進紀錄（best_flow.json）
}

message StartBestFlowRunResponse {
  string json = 1;
}

// 選擇準則：min_gain 為 0 時用 1；max_mean_ms 為 0 表示不限
message GetBestFlowRunRequest {
  string run_dir = 1;
  int32 min_gain = 2;
  int32 max_new_wrong = 3;
  double max_mean_ms = 4;
}

message GetBestFlowRunResponse {
  string json = 1;
}

// truths_json：{"圖片 id": "條碼" | "" | null}；""＝沒有條碼，null＝取消人工確認
message SetBestFlowTruthRequest {
  string run_dir = 1;
  string truths_json = 2;
  int32 min_gain = 3;
  int32 max_new_wrong = 4;
  double max_mean_ms = 5;
}

// 內容同 GetBestFlowRunResponse（更新後的真值表與結論）
message SetBestFlowTruthResponse {
  string json = 1;
}

// 圖片批次命名的參數（見 dietai.devtools.image_naming.plan）；start 0＝接在既有最大序號之後，
// width 0＝預設 3 位，order 空字串＝mtime，no_code 空字串＝nocode
message ImageNamingOptions {
  string folder = 1;
  string category = 2;
  string batch = 3;
  int32 start = 4;
  int32 width = 5;
  string order = 6;
  bool include_unknown = 7;
  string no_code = 8;
}

message PreviewImageNamesRequest {
  ImageNamingOptions options = 1;
}

// json：每個檔案的新檔名與狀態、統計、主檔名長度、是否可還原
message PreviewImageNamesResponse {
  string json = 1;
}

message ApplyImageNamesRequest {
  ImageNamingOptions options = 1;
}

// json：改名數（renamed）與改名後的預覽
message ApplyImageNamesResponse {
  string json = 1;
}

message UndoImageNamesRequest {
  string folder = 1;
}

// json：還原數（restored）與無法還原的說明（problems）
message UndoImageNamesResponse {
  string json = 1;
}

// path 空字串＝起點（Windows 為各磁碟機）
message ListFoldersRequest {
  string path = 1;
}

// json：{path, parent, folders: [{name, path, images, locked}], images, truncated}
message ListFoldersResponse {
  string json = 1;
}
