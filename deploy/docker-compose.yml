# 本地開發：make up 一次啟動所有服務
name: diet-app

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  migrate:
    image: migrate/migrate
    command: ["-path", "/migrations", "-database",
              "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    volumes: [../db/migrations:/migrations:ro]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ../api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      AI_GRPC_ADDR: ai:50051
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports: ["8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  ai:
    build: ../ai
    environment:
      # 唯讀帳號；只能讀取 ai_* view
      DATABASE_URL: postgres://${AI_DB_USER}:${AI_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    ports: ["50051:50051"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  db-data:
  minio-data:
